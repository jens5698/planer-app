name: Build
on:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk planer.apk
      - uses: actions/upload-artifact@v5
        with:
          name: planer-debug-apk
          path: planer.apk
      # Jeder Push auf main wird ein Release mit der APK als direktem Download.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${BUILD_NUMBER}" planer.apk \
            --title "Planer 0.1.${BUILD_NUMBER}" \
            --notes "${{ github.event.head_commit.message }}" \
            --target "${{ github.sha }}"
